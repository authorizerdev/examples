# SPIFFE JWT-SVID → Authorizer access token, secretless.
#
# Images:
#   - authorizer:local is a locally-built image from server main. Substitute
#     the next published release (quay.io/authorizer/authorizer:<tag>) once it
#     ships.
#   - SPIRE 1.12.4 images are pinned; bump freely.
#
# Startup is two-phase because agent node-attestation needs a one-time join
# token from the server — run ./setup.sh instead of a bare `docker compose up`.
#
# WARNING: the JWT keypair and admin secret on the authorizer service are the
# repo's PUBLIC dev keys (same as `make dev`). Demo only.
services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.12.4
    # Demo only: run as root so the named volumes (root-owned on first use) are
    # writable and the shared API socket is readable by spire-oidc.
    user: "0:0"
    command: ["-config", "/etc/spire/server.conf"]
    volumes:
      - ./conf/server:/etc/spire:ro
      - spire-server-data:/run/spire/data
      # Server API socket, shared with the OIDC discovery provider.
      - spire-server-socket:/tmp/spire-server/private

  spire-oidc:
    image: ghcr.io/spiffe/oidc-discovery-provider:1.12.4
    user: "0:0"
    command: ["-config", "/etc/oidc/oidc-discovery-provider.conf"]
    depends_on:
      - spire-server
    volumes:
      - ./conf/oidc:/etc/oidc:ro
      - spire-server-socket:/tmp/spire-server/private
    ports:
      # JWKS at http://localhost:9988/keys — expose this publicly (tunnel) for
      # Authorizer's SSRF-hardened fetcher; see README.
      - "9988:8443"

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.12.4
    user: "0:0"
    command: ["-config", "/etc/spire/agent.conf"]
    depends_on:
      - spire-server
    pid: "host" # unix workload attestor reads peer pids on the shared socket
    volumes:
      - ./conf/agent:/etc/spire:ro
      - spire-agent-data:/run/spire/data
      - spiffe-workload-api:/spiffe-workload-api
    # Started by setup.sh AFTER the join token is written into agent.conf.
    profiles: ["phase2"]

  authorizer:
    image: authorizer:local
    # Demo only: the image runs as the non-root `authorizer` user, which cannot
    # write the root-owned named volume at /data.
    user: "0:0"
    ports:
      - "8080:8080"
    command:
      - --database-type=sqlite
      - --database-url=/data/authorizer.db
      - --admin-secret=admin
