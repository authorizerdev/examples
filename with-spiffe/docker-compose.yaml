  workload:
    build: ./workload
    depends_on:
      - authorizer
    environment:
      AUTHORIZER_URL: http://authorizer:8080
      AUDIENCE: http://authorizer:8080 # must equal the trusted issuer's expected_aud
      SPIFFE_ENDPOINT_SOCKET: unix:///spiffe-workload-api/spire-agent.sock
      INTERVAL: 5m
    # Share the host pid namespace with the agent so the unix workload
    # attestor can resolve this container's process.
    pid: "host"
    volumes:
      - spiffe-workload-api:/spiffe-workload-api
    # Started by setup.sh after agent attestation + registration entries.
    profiles: ["phase2"]

volumes:
  spire-server-data:
  spire-server-socket:
  spire-agent-data:
  spiffe-workload-api:
  authorizer-data:
