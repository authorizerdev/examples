# SPIRE OIDC Discovery Provider: serves /.well-known/openid-configuration and
# /keys (the JWKS) for the trust domain's JWT-SVID signing keys.
#
# Demo only: plain HTTP on :8443. In production this sits behind TLS at a
# public domain (that public reachability is exactly what Authorizer's
# SSRF-hardened JWKS fetcher requires — see ../README.md).
log_level = "INFO"

# Domains the provider will answer for. Include the compose service name and
# whatever public host you expose it on — ADD YOUR TUNNEL/PUBLIC HOST HERE,
# requests with an unlisted Host header are refused.
domains = ["oidc-discovery.demo.example", "spire-oidc", "localhost"]

allow_insecure_scheme = true
insecure_addr = ":8443"

server_api {
    address = "unix:///tmp/spire-server/private/api.sock"
}
