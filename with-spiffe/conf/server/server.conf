server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "demo.example"
    data_dir = "/run/spire/data"
    log_level = "INFO"

    # `iss` claim stamped into every JWT-SVID. The Authorizer trusted-issuer
    # row's issuer_url must equal this exactly. Conventionally this is the
    # public URL of the OIDC discovery provider.
    jwt_issuer = "https://oidc-discovery.demo.example"

    ca_ttl = "24h"
    default_jwt_svid_ttl = "5m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/run/spire/data/datastore.sqlite3"
        }
    }

    # Join-token node attestation: setup.sh generates a one-time token and
    # writes it into the agent's conf before starting it.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/run/spire/data/keys.json"
        }
    }
}
