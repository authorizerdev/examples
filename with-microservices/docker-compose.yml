# Full topology in one network. NOTE: the authorizer image below is a
# placeholder — build it from main first:
#   cd <authorizer repo> && make build-local-image VERSION=local
# which produces quay.io/authorizer/authorizer:local (or docker build . -t
# authorizer:local and adjust the image name).
#
# Inside this network every party reaches Authorizer as http://authorizer:8080,
# so token `iss` claims are consistent (Authorizer derives `iss` from the
# request host — see README "The issuer pitfall"). Run the demo from inside
# the network too:
#   docker compose run --rm setup
#   docker compose exec gateway node scripts/demo.js
services:
  authorizer:
    image: quay.io/authorizer/authorizer:local # placeholder — build from main
    command:
      - --database-type=sqlite
      - --database-url=/data/authorizer.db
      # RS256 requires an explicit keypair (the server refuses to boot without
      # one). This is the SAME well-known dev keypair `make dev` uses in the
      # server repo — public knowledge, demo only, NEVER deploy it.
