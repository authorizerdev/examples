      # Demo-only secrets — never reuse.
      - --admin-secret=admin
      - --client-id=kbyuFDidLLm280LIwVFiazOqjO3ty8KH
      - --client-secret=demo-instance-client-secret-do-not-use
      # allowed-origins gates both CORS and CSRF Origin checks on /graphql.
      - --allowed-origins=authorizer:8080,localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - authorizer-data:/data

  setup:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      AUTHORIZER_URL: http://authorizer:8080
      AUTHORIZER_ADMIN_SECRET: admin
      AUTHORIZER_CLIENT_ID: kbyuFDidLLm280LIwVFiazOqjO3ty8KH
    command: sh -c "npm install && node setup.js"
    depends_on:
      - authorizer
    profiles: ["setup"] # run explicitly: docker compose run --rm setup

  gateway:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      AUTHORIZER_URL: http://authorizer:8080
      ORDERS_URL: http://orders:4001
      BILLING_URL: http://billing:4002
      GATEWAY_URL: http://localhost:4000
    command: sh -c "npm install && node gateway/server.js"
    ports:
      - "4000:4000"
    depends_on:
      - authorizer

  orders:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      AUTHORIZER_URL: http://authorizer:8080
      BILLING_URL: http://billing:4002
    command: sh -c "npm install && node orders-service/server.js"
    # no ports: — internal only; the trust boundary is the compose network
    depends_on:
      - authorizer

  billing:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      AUTHORIZER_URL: http://authorizer:8080
    command: sh -c "npm install && node billing-service/server.js"
    # no ports: — internal only
    depends_on:
      - authorizer

volumes:
  authorizer-data:
