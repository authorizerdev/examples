# kind create cluster --name authorizer-demo --config kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: authorizer-demo
nodes:
  - role: control-plane
    extraPortMappings:
      # Expose the authorizer Service (NodePort 30080) on the host for the
      # admin GraphQL calls in setup.md.
      - containerPort: 30080
        hostPort: 30080
