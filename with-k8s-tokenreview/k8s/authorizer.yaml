# Authorizer server, self-contained (SQLite on an emptyDir).
#
# Image: `authorizer:local` is a locally-built image — load it into kind with
#   kind load docker-image authorizer:local --name authorizer-demo
# Substitute the next published release (quay.io/authorizer/authorizer:<tag>)
# once it ships, and drop imagePullPolicy: Never.
#
# WARNING: the JWT keypair and admin secret below are the repo's PUBLIC dev
# keys (same as `make dev`). Demo only — never deploy them anywhere real.
apiVersion: v1
kind: Namespace
metadata:
  name: authorizer-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorizer
  namespace: authorizer-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authorizer
  template:
    metadata:
      labels:
        app: authorizer
    spec:
      # ServiceAccount bound to system:auth-delegator (rbac.yaml) so Authorizer
      # can call the TokenReview API with its own projected token.
      serviceAccountName: authorizer
      containers:
        - name: authorizer
          image: authorizer:local
          imagePullPolicy: Never
          args:
            - --database-type=sqlite
            - --database-url=/data/authorizer.db
